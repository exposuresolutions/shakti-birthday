<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Shakti Birthday Pleasures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<style>
/* Layout: one vertical quest-line. A sticky progress bar on top, chapters stacked, each a full card with her photo as the chapter opener. Tropical print (her dresses) meets Irish breakfast. Spanish for Shakti, English for Dan. */
:root{
  --bg:#fff7ee; --paper:#ffffff; --fg:#2b1d24; --muted:#7a6670;
  --hib:#e2457a; --hib-soft:#ffe1ea; --palm:#2f6b4f; --palm-soft:#dcefe3;
  --sun:#f2b632; --sun-soft:#fff0c2; --sun-ink:#7a5200; --line:#ead9d0; --warn:#c2410c; --warn-soft:#ffe4d6;
  --shadow:0 10px 30px rgba(90,40,60,.12);
  --display:"Yeseva One", Georgia, "Times New Roman", serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1218; --paper:#251a21; --fg:#fbeef3; --muted:#c3a9b4;
    --hib:#ff6b9d; --hib-soft:#4a2436; --palm:#6fc294; --palm-soft:#1f3a2c;
    --sun:#ffcd57; --sun-soft:#4a3a12; --sun-ink:#ffcd57; --line:#43303a; --warn:#ff9a6b; --warn-soft:#4a2a1c;
    --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1218; --paper:#251a21; --fg:#fbeef3; --muted:#c3a9b4;
  --hib:#ff6b9d; --hib-soft:#4a2436; --palm:#6fc294; --palm-soft:#1f3a2c;
  --sun:#ffcd57; --sun-soft:#4a3a12; --sun-ink:#ffcd57; --line:#43303a; --warn:#ff9a6b; --warn-soft:#4a2a1c;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:8px}
.top .pts{font-weight:800;color:var(--hib);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hib),var(--sun));transition:width .5s ease}
.mode,.lang{border:2px solid var(--line);background:var(--paper);color:var(--fg);border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.mode.on{border-color:var(--hib);background:var(--hib-soft)}
.lang{border-color:var(--palm);color:var(--palm)}
.hero{display:grid;gap:14px;padding-block:14px 26px;text-align:center}
.hero .ring{width:min(62vw,230px);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:50%;padding:6px;
  background:conic-gradient(from 20deg,var(--hib),var(--sun),var(--palm),var(--hib));animation:spin 14s linear infinite}
.hero .ring img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;border:5px solid var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hero .ring,.hero h1,.float span,.applelab *,.gate0.bye,.gate0 .gImg{animation:none}.bar i{transition:none}.gate0.bye{opacity:0;visibility:hidden}}
.hero{position:relative;overflow:hidden;border-radius:24px}
.hero>*:not(.float){position:relative;z-index:1}
.hero h1{font-size:clamp(38px,11vw,60px);color:var(--hib);background:linear-gradient(90deg,var(--hib),var(--sun),var(--palm),var(--hib));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{to{background-position:300% 0}}
.float{position:absolute;inset:0;pointer-events:none;z-index:0}
.float span{position:absolute;font-size:28px;opacity:.75;animation:floaty 9s ease-in-out infinite}
.float span:nth-child(2n){animation-duration:11s;animation-delay:-3s}.float span:nth-child(3n){animation-duration:13s;animation-delay:-6s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-26px) rotate(10deg)}}
.gate0{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;overflow:hidden;background:var(--bg);padding:24px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px))}
.gate0 .inner{position:relative;z-index:1;display:grid;gap:14px;max-width:420px;justify-items:center}
.gate0 .gImg{width:min(72vw,300px);aspect-ratio:3/4;max-width:100%;object-fit:cover;object-position:50% 12%;border-radius:28px;border:4px solid var(--sun);box-shadow:0 20px 50px rgba(226,69,122,.35);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 20px 50px rgba(226,69,122,.35),0 0 0 0 rgba(242,182,50,.0)}to{box-shadow:0 24px 60px rgba(226,69,122,.55),0 0 0 10px rgba(242,182,50,.18)}}
.gate0 h1{font-size:clamp(44px,14vw,72px);color:var(--hib)}
.gate0 .gq{font-size:22px;font-weight:800;text-wrap:balance}
.gBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:70px}
.btn.big{font-size:22px;padding:16px 30px;transition:transform .25s}
#gateNo{transition:transform .25s}
.gate0.bye{animation:bye .6s ease forwards}
@keyframes bye{to{opacity:0;transform:scale(1.15);visibility:hidden}}
.vrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.vbtn{padding:10px 12px;font-size:18px}
.news{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--hib);color:#fff;border-radius:16px;padding:10px 12px;font-weight:800;margin-block:4px 10px;animation:pop .5s cubic-bezier(.2,.9,.2,1.2) both}
.news button{border:0;border-radius:99px;padding:6px 12px;background:#fff;color:var(--hib);font-weight:800}
.plRow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.yt{display:inline-block;border-radius:12px;padding:8px 10px;background:#e62117;color:#fff;font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chips span{background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
.hero .sub{font-size:19px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--palm)}
.count{display:flex;justify-content:center;gap:8px}
.count div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-width:64px}
.count b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--hib)}
.count.big div{min-width:84px;padding:10px 12px;border-color:var(--hib);box-shadow:var(--shadow)}
.count.big b{font-size:44px}
.mini{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;color:var(--sun-ink);white-space:nowrap;background:var(--sun-soft);border-radius:99px;padding:3px 8px}
.count span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chapter{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-block:18px;border:1px solid var(--line)}
.chapter .head{position:relative;min-height:170px;display:flex;align-items:flex-end;padding:16px;color:#fff;background:#333 center/cover no-repeat}
.chapter .head::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(30,10,20,.85))}
.chapter .head>*{position:relative}
.chapter .head .eyebrow{color:#ffd9e6}
.chapter .head h2{font-size:clamp(26px,7vw,34px);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.chapter .body{padding:16px;display:grid;gap:14px}
.lead{font-size:17px}
.note{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.04em}
.pill.pts{background:var(--sun-soft);color:var(--sun-ink)}
.pill.done{background:var(--palm-soft);color:var(--palm)}
.pill.hot{background:var(--hib-soft);color:var(--hib)}
.q{display:grid;gap:8px}
.q .label{font-weight:800}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:99px;padding:8px 14px;font-weight:600}
.opts button.sel{border-color:var(--hib);background:var(--hib-soft);color:var(--fg)}
textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
textarea{min-height:74px;resize:vertical}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;background:var(--hib);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.btn.sec{background:var(--palm)}
.btn.ghost{background:var(--bg);color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{min-width:0}
.menu{display:grid;gap:10px}
.cat{font-family:var(--display);font-size:20px;color:var(--palm);margin-top:6px}
.dish{display:grid;grid-template-columns:72px 1fr auto;grid-template-rows:auto auto;gap:4px 10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:8px 10px;background:var(--bg)}
.dish img{grid-row:1 / span 2;width:72px;height:72px;object-fit:cover;border-radius:12px;background:var(--line)}
.dish.in{border-color:var(--hib);background:var(--hib-soft)}
.dish .n{font-weight:800}
.dish .n{grid-column:2;grid-row:1}
.dish .d{font-size:13px;color:var(--muted);grid-column:2;grid-row:2;line-height:1.3}
.dish .chili{color:var(--warn);font-size:13px;letter-spacing:-2px}
.qty{grid-column:3;grid-row:1 / span 2;display:flex;align-items:center;gap:6px;justify-self:end}
.qty button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper);color:var(--fg);font-weight:800;font-size:18px;line-height:1}
.qty b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.spice{display:grid;gap:6px}
.spice input{width:100%;accent-color:var(--hib)}
.spice .lv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* rewards */
.rewards{display:grid;gap:8px}
.reward{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--bg)}
.reward .p{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:56px}
.reward .n{font-weight:700;filter:blur(4px);user-select:none}
.reward .s{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.reward.open{border-color:var(--sun);background:var(--sun-soft)}
.reward.open .p{color:var(--sun-ink)}
.reward.open .n{filter:none}
.reward.open .s{color:var(--sun-ink)}
.reward.next{border-style:dashed;border-color:var(--hib)}
.reward .detail{margin-top:6px;font-size:14px;line-height:1.45;color:var(--fg)}
.chat{display:grid;gap:8px}
.bubble{max-width:88%;background:var(--palm-soft);border:2px solid var(--palm);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:16px;line-height:1.4;animation:pop .4s cubic-bezier(.2,.9,.2,1.2) both}
.bubble.new{border-color:var(--hib);background:var(--hib-soft)}
.bubble small{display:block;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.tip{background:var(--palm-soft);border-left:5px solid var(--palm);border-radius:12px;padding:10px 12px;font-weight:600}
.ordered{display:grid;gap:10px;border:3px solid var(--sun);border-radius:18px;padding:12px;background:var(--sun-soft)}
.ordered img{width:100%;max-width:100%;border-radius:12px;display:block}
.ordered h3{font-size:22px}
.ordered .desc{font-size:15px}
/* menu for two picker */
.m2{border-style:solid;border-color:var(--hib);background:var(--hib-soft)}
.abRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{border:3px solid var(--line);border-radius:16px;padding:0;overflow:hidden;background:var(--paper);color:var(--fg);text-align:left;display:grid}
.ab img{width:100%;height:90px;object-fit:cover;display:block}
.ab b{font-family:var(--display);font-size:22px;font-weight:400;padding:8px 10px 0}
.ab small{font-size:12px;color:var(--muted);padding:2px 10px 10px;line-height:1.3}
.ab.sel{border-color:var(--hib);box-shadow:0 0 0 3px var(--hib-soft)}
@media (max-width:420px){.abRow{grid-template-columns:1fr}}
/* apple lab */
.applelab{position:relative;height:240px;border-radius:16px;background:var(--palm-soft);overflow:hidden}
.applelab svg{position:absolute;left:4%;top:6px;width:58%;height:190px}
.applelab .hole{opacity:0}
.applelab .hole.top{animation:holeTop 12s linear infinite}
.applelab .hole.side{animation:holeSide 12s linear infinite}
@keyframes holeTop{0%,22%{opacity:0}26%,100%{opacity:1}}
@keyframes holeSide{0%,46%{opacity:0}50%,100%{opacity:1}}
.applelab .foil{opacity:0;animation:foil 12s linear infinite}
@keyframes foil{0%,62%{opacity:0}66%,100%{opacity:1}}
.applelab .pen.top{animation:penTop 12s linear infinite}
@keyframes penTop{0%,3%{transform:translateY(-40px);opacity:0}8%{opacity:1;transform:translateY(-40px)}20%{transform:translateY(40px)}26%{transform:translateY(-10px)}30%,100%{transform:translateY(-120px);opacity:0}}
.applelab .pen.side{animation:penSide 12s linear infinite}
@keyframes penSide{0%,30%{transform:translateX(60px);opacity:0}34%{opacity:1;transform:translateX(60px)}44%{transform:translateX(-62px)}50%{transform:translateX(-20px)}54%,100%{transform:translateX(120px);opacity:0}}
.applelab .ava{position:absolute;right:12px;bottom:52px;width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:4px solid var(--sun);opacity:0;animation:avaIn 12s linear infinite}
@keyframes avaIn{0%,68%{opacity:0;transform:translateY(24px) scale(.8)}74%,100%{opacity:1;transform:none}}
.puff{position:absolute;right:96px;bottom:118px;font-size:28px;opacity:0;animation:puff 12s linear infinite}
.puff.p2{animation-delay:1.3s;right:106px}
@keyframes puff{0%,78%{opacity:0;transform:translate(0,0) scale(.5)}84%{opacity:1}100%{opacity:0;transform:translate(-34px,-70px) scale(1.5)}}
.applelab .caps{position:absolute;left:0;right:0;bottom:0;height:44px;padding:8px 10px;background:rgba(20,8,14,.55);color:#fff;font-size:13px;font-weight:700}
.caps span{position:absolute;left:10px;right:10px;opacity:0;animation:cap 12s linear infinite}
.caps span:nth-child(2){animation-delay:3s}.caps span:nth-child(3){animation-delay:6s}.caps span:nth-child(4){animation-delay:9s}
@keyframes cap{0%,1%{opacity:0}4%,23%{opacity:1}26%,100%{opacity:0}}
/* memories */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gallery figure{margin:0;display:grid;gap:4px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:3px solid var(--sun);max-width:100%}
.gallery figcaption{font-size:11px;font-weight:800;color:var(--muted);text-align:center;line-height:1.2}
.basket{border:2px dashed var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.basket .tot{display:flex;justify-content:space-between;font-weight:800;border-top:2px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.basket ul{margin:0;padding-left:18px;font-size:15px}
.basket .rm{border:0;background:none;color:var(--muted);font-weight:800;padding:0 6px;cursor:pointer}
.deadline{display:flex;align-items:center;gap:10px;background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-weight:700}
.deadline b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.map{width:100%;max-width:100%;height:auto;display:block;border-radius:16px;background:var(--palm-soft)}
.stop{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding-block:8px}
.stop .dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.stop.here .dot{border-color:var(--hib);background:var(--hib);color:#fff}
.stop.past .dot{border-color:var(--palm);background:var(--palm);color:#fff}
.stop .t{font-weight:800}
.stop .s{font-size:14px;color:var(--muted)}
.stop button{margin-top:4px;font-size:13px;border-radius:99px;padding:5px 12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font-weight:700}
.ev{display:grid;gap:8px}
.ev label.up{display:grid;place-items:center;gap:4px;border:2px dashed var(--hib);border-radius:16px;padding:14px;background:var(--hib-soft);cursor:pointer;text-align:center;font-weight:700}
.ev label.up input{position:absolute;opacity:0;width:1px;height:1px}
.ev .thumbs{display:flex;flex-wrap:wrap;gap:8px}
.ev .thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:3px solid var(--palm)}
.plate{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.plate label{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center;background:var(--bg);cursor:pointer;font-weight:700;font-size:15px}
.plate label:has(input:checked){border-color:var(--palm);background:var(--palm-soft)}
.plate input{accent-color:var(--palm);width:18px;height:18px}
.wx{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-radius:16px;padding:12px;background:var(--warn-soft);border:2px solid var(--warn)}
.wx.ok{background:var(--palm-soft);border-color:var(--palm)}
.wx .ico{font-size:40px;line-height:1}
.wx b{color:var(--warn)}
.wx.ok b{color:var(--palm)}
.wx small{display:block;color:var(--muted);font-size:13px}
.plans{display:grid;gap:8px}
.plans button{text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);color:var(--fg);font-weight:600}
.plans button.sel{border-color:var(--palm);background:var(--palm-soft)}
.links a{color:var(--palm);font-weight:800}
.quest{border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.quest.done{border-color:var(--palm)}
.quest .qt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.quest .qt h3{font-size:20px}
.quest .desc{font-size:15px}
.quest.hot{border-color:var(--hib);background:var(--hib-soft)}
.wishes{display:grid;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
.gate{display:grid;gap:10px;background:var(--hib-soft);border-radius:16px;padding:12px}
.summary{white-space:pre-wrap;font-size:14px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;max-height:260px;overflow:auto}
/* motion */
@keyframes rise{from{transform:translateY(18px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.chapter{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 0 0 rgba(226,69,122,.5)}50%{box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 0 14px rgba(226,69,122,0)}}
#dinnerDoneBtn{animation:pulse 2s infinite}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
.reward.open{animation:flip .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:top}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:max(16px, env(safe-area-inset-left, 0px));background:rgba(20,8,14,.78);backdrop-filter:blur(6px)}
.modal .card{background:var(--paper);color:var(--fg);border-radius:24px;padding:22px 18px;max-width:440px;width:100%;display:grid;gap:12px;text-align:center;animation:pop .45s cubic-bezier(.2,.9,.2,1.2) both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:28px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:3px solid var(--line);border-radius:18px;padding:16px 10px;background:var(--bg);color:var(--fg);display:grid;gap:6px;transition:transform .15s}
.choice:hover{transform:translateY(-3px)}
.choice b{font-family:var(--display);font-size:24px;font-weight:400}
.choice span{font-size:13px;color:var(--muted)}
.choice.nice{border-color:var(--palm)}.choice.naughty{border-color:var(--hib);background:var(--hib-soft)}
.rules{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--bg);display:grid;gap:6px}
.rules ol{margin:0;padding-left:20px;font-size:15px;display:grid;gap:4px}
.rules .stop{font-weight:800;color:var(--warn)}
.lvl{border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;background:var(--bg);margin-top:10px;transition:filter .4s}
.lvl.locked{filter:grayscale(1);opacity:.55;pointer-events:none}
.lvl.sent{border-color:var(--palm)}
.lvl.dare{border-color:var(--hib);background:var(--hib-soft)}
.lvl h3{font-size:22px}
.lvl .badge{display:inline-block;background:var(--hib);color:#fff;font-size:11px;letter-spacing:.14em;font-weight:800;padding:3px 10px;border-radius:99px;animation:pulse 2s infinite}
.wheelWrap{position:relative;width:min(260px,80vw);max-width:100%;aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--paper);box-shadow:var(--shadow);transition:transform 4s cubic-bezier(.15,.85,.1,1);background:conic-gradient(var(--hib) 0 12.5%,var(--sun) 0 25%,var(--palm) 0 37.5%,var(--hib-soft) 0 50%,var(--hib) 0 62.5%,var(--sun) 0 75%,var(--palm) 0 87.5%,var(--hib-soft) 0)}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;color:var(--fg)}
@media (prefers-reduced-motion:reduce){.chapter,.reward.open,.modal .card{animation:none}#dinnerDoneBtn,.lvl .badge{animation:none}.wheel{transition:none}}
footer{text-align:center;color:var(--muted);font-size:13px;padding-block:20px}

/* ===== state ===== */
const KEY='shakti-bday-v2';
let S={lang:'es',answers:{},texts:{},order:{},spice:2,notes:'',stop:0,ev:{},done:{},plate:null,plan:null,wishes:['','',''],pts:0,awarded:{},adult:false,started:null,set:{}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const L=()=>S.lang||'es';
const t=k=>T[L()][k]||T.en[k]||k;
const tx=o=>typeof o==='string'?o:(o[L()]||o.en||o.es);
const txEn=o=>typeof o==='string'?o:(o.en||o.es);
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}
function award(key,n,msg){if(S.awarded[key])return;S.awarded[key]=true;S.pts+=n;save();renderPts();confetti();toast(msg||('+'+n));
  if(S.pts>=500&&!S.awarded.prize){S.awarded.prize=true;save();setTimeout(()=>toast(t('prize')),2300);}}
const MAXPTS=1300;
function renderPts(){$('#pts').textContent=S.pts+' pts';$('#barFill').style.width=Math.min(100,S.pts/MAXPTS*100)+'%';renderRewards();}
function renderRewards(){const box=$('#rewards');if(!box)return;box.innerHTML='';let nextDone=false;
  CONFIG.unlocks.forEach((u,i)=>{const open=S.pts>=u.pts;const d=document.createElement('div');d.className='reward'+(open?' open':'')+(!open&&!nextDone?' next':'');if(!open)nextDone=true;
    d.innerHTML='<div class="p">'+u.pts+'</div><div><div class="n">'+(open?tx(u):'????????????')+'</div><div class="s">'+(open?t('unlocked'):t('locked')+' · '+Math.max(0,u.pts-S.pts)+' pts')+'</div>'+(open&&u.detail?'<p class="detail">'+tx(u.detail)+'</p>':'')+'</div><div>'+(open?'🔓':'🔒')+'</div>';
    box.appendChild(d);
    if(open&&!(S.unlockedSeen||(S.unlockedSeen={}))[i]){S.unlockedSeen[i]=true;save();setTimeout(()=>toast(t('unlockToast')+tx(u)),1200*(i%3+1));}});}

/* ===== language ===== */
function applyLang(){document.documentElement.lang=L();
  $$('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  $$('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp);});
  $('#langBtn').textContent=L()==='es'?'EN':'ES';$('#musicBtn').textContent=Music.playing?t('musicOff'):t('musicOn');
  renderMode();renderQuestions();renderSpice();renderSet();renderMenu();renderStops();renderPlate();renderPlans();renderBoard();renderWx();renderRules();renderDessert();renderMenu2();renderPlaylist();renderNews();renderDan();
  if(!$('#summary').hidden)$('#summary').textContent=summaryText();}
$('#langBtn').addEventListener('click',()=>{S.lang=L()==='es'?'en':'es';save();applyLang();});

/* ===== countdown + order deadline ===== */
function setCount(h,m,s){[['#cH','#gH',h],['#cM','#gM',m],['#cS','#gS',s]].forEach(([a,b,v])=>{const x=$(a),y=$(b);if(x)x.textContent=v;if(y)y.textContent=v;});const mc=$('#miniCount');if(mc)mc.textContent='🎂 '+h+':'+m+':'+s;}
function tick(){const d=new Date(CONFIG.birthdayISO)-Date.now();
  if(d<=0){setCount('00','00','00');$$('[data-t="countLbl"]').forEach(x=>x.textContent=t('bdayNow'));const mc=$('#miniCount');if(mc)mc.textContent='🎂 '+t('bdayMini');
    if(!S.midnightShown&&$('#bdayModal').hidden){$('#bdayModal').hidden=false;confetti();}}
  else{const h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);setCount(String(h).padStart(2,'0'),String(m).padStart(2,'0'),String(s).padStart(2,'0'));}
  if(!S.started){S.started=Date.now();save();}
  const left=S.started+CONFIG.orderDeadlineMinutes*6e4-Date.now();
  $('#orderTimer').textContent=left<=0?'00:00':String(Math.floor(left/6e4)).padStart(2,'0')+':'+String(Math.floor(left%6e4/1e3)).padStart(2,'0');}
setInterval(tick,1000);
$('#startBtn').addEventListener('click',()=>$('#ch0').scrollIntoView({behavior:'smooth'}));

/* ===== option questions ===== */
function renderQuestions(){$$('.q[data-qid]').forEach(box=>{const id=box.dataset.qid,q=QS[id];
  box.innerHTML='<p class="label">'+tx(q.l)+'</p><div class="opts">'+q.o.map(o=>'<button data-v="'+o.v+'"'+(S.answers[id]===o.v?' class="sel"':'')+'>'+tx(o)+'</button>').join('')+'</div>';
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.answers[id]=b.dataset.v;save();renderQuestions();track(txEn(q.l)+' → '+txEn(q.o.find(o=>o.v===b.dataset.v)||''));
    if(id==='spiceq'){const map={mild:1,medium:2,hot:3,fear:4};S.spice=map[b.dataset.v];$('#spice').value=S.spice;renderSpice();}}));});}
function ansEn(id){const q=QS[id];if(!q||!S.answers[id])return '?';const o=q.o.find(x=>x.v===S.answers[id]);return o?txEn(o):'?';}
$$('textarea[data-txt]').forEach(el=>{el.value=S.texts[el.dataset.txt]||'';el.addEventListener('input',()=>{S.texts[el.dataset.txt]=el.value;save();});});
$('#songIn').value=S.texts.song||'';$('#songIn').addEventListener('input',e=>{S.texts.song=e.target.value;save();});
$('#ch0Done').addEventListener('click',()=>{const n=['mood','hunger','spiceq'].filter(k=>S.answers[k]).length;
  if(n<3){toast(t('answer3'));return;}award('ch0',30,t('ch0Award'));stageSend('🎯 WARM-UP (Shakti): mood '+ansEn('mood')+' · hunger '+ansEn('hunger')+' · spice '+ansEn('spiceq')+(S.texts.song?' · walk-in song: '+S.texts.song:'')+'\n🎮 GAMES: video games '+ansEn('gq1')+(S.texts.gq2?' · favourite: '+S.texts.gq2:'')+' · real life: '+ansEn('gq3')+' · '+ansEn('gq5')+(S.texts.gq4?'\n💡 Her game idea: '+S.texts.gq4:''));$('#ch2').scrollIntoView({behavior:'smooth'});});

/* ===== dinner ===== */
function renderSpice(){const lv=T[L()].spiceLv;$('#spiceVal').textContent=lv[S.spice];$('#spiceScale').innerHTML=lv.map(x=>'<span>'+x+'</span>').join('');}
$('#spice').value=S.spice;
$('#spice').addEventListener('input',e=>{S.spice=+e.target.value;renderSpice();save();});
function renderSet(){const m=CONFIG.setMenu;const box=$('#setMenu');
  box.innerHTML='<strong>'+t('setTitle')+'</strong><p class="note">'+t('setNote')+'</p>'+
    m.courses.map((c,ci)=>'<div class="q"><p class="label">'+tx(c.c)+'</p><div class="opts" data-ci="'+ci+'">'+c.o.map((o,oi)=>'<button data-oi="'+oi+'"'+(S.set[ci]===oi?' class="sel"':'')+'>'+tx(o)+'</button>').join('')+'</div></div>').join('')+
    '<button class="btn sec" id="addSet">'+t('addSet')+'</button>';
  box.querySelectorAll('.opts').forEach(r=>r.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.set[r.dataset.ci]=+b.dataset.oi;save();renderSet();})));
  $('#addSet').addEventListener('click',()=>{const miss=m.courses.findIndex((c,ci)=>S.set[ci]==null);if(miss>=0){toast(t('pickFirst')+tx(m.courses[miss].c).toLowerCase());return;}
    const key='SET:'+m.courses.map((c,ci)=>S.set[ci]).join(',');S.order[key]=(S.order[key]||0)+1;save();renderMenu();toast(t('setAdded'));});}
function itemByKey(k){if(k.startsWith('SET:')){const idx=k.slice(4).split(',').map(Number);const m=CONFIG.setMenu;return {es:m.name.es+' ('+m.courses.map((c,ci)=>c.o[idx[ci]].es).join(' / ')+')',en:m.name.en+' ('+m.courses.map((c,ci)=>c.o[idx[ci]].en).join(' / ')+')'};}
  for(const c of CONFIG.menu)for(const i of c.items)if(i.en===k)return i;return {es:k,en:k};}
function renderMenu(){const m=$('#menu');m.innerHTML='';
  CONFIG.menu.forEach(cat=>{const h=document.createElement('div');h.className='cat';h.textContent=tx(cat.cat);m.appendChild(h);
    cat.items.forEach(it=>{const k=it.en;const q=S.order[k]||0;const d=document.createElement('div');d.className='dish'+(q?' in':'');
      const im=it.img||cat.img;
      d.innerHTML=(im?'<img src="img/food/'+im+'.jpg" data-f="img/food/'+(cat.img||'')+'.jpg" alt="" loading="lazy" onerror="if(this.dataset.f&&this.src.indexOf(this.dataset.f)<0){this.src=this.dataset.f}else{this.remove()}">':'')+'<div class="n">'+tx(it)+' <span class="chili">'+'🌶'.repeat(it.c||0)+'</span></div>'+(it.d?'<div class="d">'+tx(it.d)+'</div>':'')+

/* ===== confetti ===== */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#confetti');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#e2457a','#f2b632','#2f6b4f','#ff9ec4','#ffffff'];const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,r:4+Math.random()*5,v:2+Math.random()*3,a:Math.random()*6,col:cols[Math.random()*cols.length|0]}));
  let f=0;(function draw(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin((p.y+p.a*50)/30);ctx.fillStyle=p.col;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.y/40);ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});if(++f<140)requestAnimationFrame(draw);else ctx.clearRect(0,0,c.width,c.height);})();}


/* ===== music: a little cumbia, synthesised live (no files needed) ===== */
const Music=(()=>{let ctx,playing=false,timer,step=0,master;
  const BPM=96,STEP=60/BPM/4; // 16th notes
  const bassPat=[0,null,7,null,0,null,7,null,5,null,12,null,5,null,7,null];           // cumbia bass: root / fifth bounce
  const melA=[12,null,14,null,16,null,19,null,16,null,14,null,12,null,null,null, 11,null,12,null,14,null,16,null,14,null,12,null,11,null,null,null];
  const melB=[16,null,19,null,21,null,19,null,16,null,14,null,12,null,null,null, 14,null,12,null,11,null,12,null,14,null,16,null,12,null,null,null];
  const chordRoots=[0,0,5,5,7,7,0,0];  // bars: I I IV IV V V I I (A minor-ish feel via melody)
  const root=110; // A2
  const f=n=>root*Math.pow(2,n/12);
  function noise(len){const b=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);return b;}
  function hit(type,time){const g=ctx.createGain();g.connect(master);
    if(type==='guiro'){const src=ctx.createBufferSource();src.buffer=noise(.09);const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3200;bp.Q.value=2;src.connect(bp);bp.connect(g);g.gain.setValueAtTime(.18,time);g.gain.exponentialRampToValueAtTime(.001,time+.09);src.start(time);}
    if(type==='conga'){const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(220,time);o.frequency.exponentialRampToValueAtTime(140,time+.08);o.connect(g);g.gain.setValueAtTime(.35,time);g.gain.exponentialRampToValueAtTime(.001,time+.18);o.start(time);o.stop(time+.2);}
    if(type==='congahi'){const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(330,time);o.frequency.exponentialRampToValueAtTime(240,time+.05);o.connect(g);g.gain.setValueAtTime(.25,time);g.gain.exponentialRampToValueAtTime(.001,time+.12);o.start(time);o.stop(time+.14);}
    if(type==='shaker'){const src=ctx.createBufferSource();src.buffer=noise(.05);const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;src.connect(hp);hp.connect(g);g.gain.setValueAtTime(.08,time);g.gain.exponentialRampToValueAtTime(.001,time+.05);src.start(time);}}
  function bass(n,time){const o=ctx.createOscillator();o.type='triangle';o.frequency.value=f(n);const g=ctx.createGain();o.connect(g);g.connect(master);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(.5,time+.01);g.gain.exponentialRampToValueAtTime(.001,time+STEP*1.8);o.start(time);o.stop(time+STEP*2);}
  function lead(n,time){ // accordion-ish: two detuned saws through a lowpass with vibrato
    const g=ctx.createGain();const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;g.connect(lp);lp.connect(master);
    [0,7].forEach(cents=>{const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f(n+12);o.detune.value=cents;const v=ctx.createOscillator();v.frequency.value=5.5;const vg=ctx.createGain();vg.gain.value=6;v.connect(vg);vg.connect(o.detune);v.start(time);o.connect(g);o.start(time);o.stop(time+STEP*1.9);v.stop(time+STEP*2);});
    g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(.11,time+.02);g.gain.setValueAtTime(.11,time+STEP*1.5);g.gain.exponentialRampToValueAtTime(.001,time+STEP*1.9);}
  function schedule(){const now=ctx.currentTime;while(nextTime<now+.25){const s16=step%16,bar=Math.floor(step/16)%8,chord=chordRoots[bar];
      // percussion: guiro on every 8th with a scrape accent, congas on the cumbia "y-caballito" pattern
      if(s16%2===0)hit('guiro',nextTime);if(s16%4===2)hit('shaker',nextTime);
      if(s16===0||s16===8)hit('conga',nextTime);if(s16===6||s16===10||s16===14)hit('congahi',nextTime);
      const b=bassPat[s16];if(b!==null)bass(chord+b,nextTime);
      const mel=(bar<4?melA:melB)[step%32];if(mel!==null&&Math.floor(step/32)%2===0)lead(chord+mel,nextTime);else if(mel!==null&&bar>=6)lead(chord+mel,nextTime);
      nextTime+=STEP;step++;}}
  let nextTime=0;
  function start(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.6;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);}
    ctx.resume();nextTime=ctx.currentTime+.05;step=0;playing=true;timer=setInterval(schedule,100);}
  function stop(){playing=false;clearInterval(timer);if(ctx)ctx.suspend();}
  return {toggle(){playing?stop():start();return playing;},get playing(){return playing;}};})();
$('#musicBtn').addEventListener('click',()=>{let on=false;try{on=Music.toggle();}catch(e){toast('🔇');return;}$('#musicBtn').textContent=on?t('musicOff'):t('musicOn');$('#musicBtn').setAttribute('aria-pressed',on);});

/* ===== rules ===== */
function renderRules(){const r=T[L()].rules;$('#rules').innerHTML='<strong>'+t('rulesTitle')+'</strong><ol>'+r.map((x,i)=>'<li'+(i===r.length-1?' class="stop"':'')+'>'+x+'</li>').join('')+'</ol>';}

/* ===== naughty or nice: alert after dinner, before dessert ===== */
function showNN(){if(S.path)return;$('#nnModal').hidden=false;}
$('#dinnerDoneBtn').addEventListener('click',()=>{S.dinnerDone=true;save();if(S.path){$('#chN').scrollIntoView({behavior:'smooth'});}else showNN();});
$('#nnLater').addEventListener('click',()=>{$('#nnModal').hidden=true;S.nnSnoozed=Date.now();save();});
$$('[data-nn]').forEach(b=>b.addEventListener('click',()=>{S.path=b.dataset.nn;S.adult=true;save();$('#nnModal').hidden=true;renderMode();renderDessert();award('path',50,t('nnPicked')+(S.path==='naughty'?t('naughty'):t('nice')));
  stageSend('🍓 AFTER DINNER: Shakti chose '+(S.path==='naughty'?'NAUGHTY 😈':'NICE 😇'));$('#chN').scrollIntoView({behavior:'smooth'});}));
setInterval(()=>{if(S.path||S.dinnerDone)return;if(S.orderSentAt&&Date.now()-S.orderSentAt>CONFIG.dinnerAlertMinutes*6e4&&(!S.nnSnoozed||Date.now()-S.nnSnoozed>10*6e4)&&$('#nnModal').hidden){showNN();}},15000);
$('#switchNaughty').addEventListener('click',()=>{S.path='naughty';save();renderDessert();stageSend('🍓 UPDATE: Shakti switched to NAUGHTY 😈');});

/* ===== dessert levels ===== */
S.lvlSent=S.lvlSent||{};
function lvlAnswered(lv){return lv.qs.filter(q=>q.k==='opt'?S.answers[q.id]:(S.texts[q.id]||'').trim()).length;}
function pick(q){const o=q.o.find(x=>x.v===S.answers[q.id]);return o?txEn(o):'—';}
function renderDessert(){const ch=$('#chN');if(!S.path){ch.hidden=true;return;}ch.hidden=false;
  $('#niceBox').hidden=S.path!=='nice';const box=$('#levels');box.innerHTML='';if(S.path!=='naughty')return;
  CONFIG.levels.forEach((lv,i)=>{const open=i===0||S.lvlSent[i-1];const sent=!!S.lvlSent[i];const d=document.createElement('div');d.className='lvl'+(open?'':' locked')+(sent?' sent':'')+(lv.dare?' dare':'');
    d.innerHTML='<div class="qt"><h3>'+tx(lv.name)+'</h3><span class="pill '+(sent?'done':'pts')+'">'+(sent?t('doneTick'):'+'+lv.pts)+'</span></div>'+(lv.dare?'<span class="badge">'+t('dareBadge')+'</span>':'')+
      (open?lv.qs.map(q=>q.k==='opt'?'<div class="q"><p class="label">'+tx(q.l)+'</p><div class="opts">'+q.o.map(o=>'<button data-q="'+q.id+'" data-v="'+o.v+'"'+(S.answers[q.id]===o.v?' class="sel"':'')+'>'+tx(o)+'</button>').join('')+'</div></div>'
        :'<div class="q"><p class="label">'+tx(q.l)+'</p><div class="vrow"><textarea data-lt="'+q.id+'" placeholder="'+tx(q.ph).replace(/"/g,'&quot;')+'">'+(S.texts[q.id]||'').replace(/</g,'&lt;')+'</textarea><button class="btn ghost vbtn" data-vq="'+q.id+'">🎙️</button></div></div>').join('')+
        '<button class="btn" data-sendlvl="'+i+'">'+t('sendLvl')+'</button>':'<p class="note">'+t('lvlLocked')+'</p>');
    d.querySelectorAll('button[data-q]').forEach(b=>b.addEventListener('click',()=>{S.answers[b.dataset.q]=b.dataset.v;save();renderDessert();}));
    d.querySelectorAll('textarea[data-lt]').forEach(ta=>ta.addEventListener('input',()=>{S.texts[ta.dataset.lt]=ta.value;save();}));
    d.querySelectorAll('[data-vq]').forEach(b=>b.addEventListener('click',()=>{const q=lv.qs.find(x=>x.id===b.dataset.vq);voiceFor(txEn(q.l));}));
    const sb=d.querySelector('[data-sendlvl]');if(sb)sb.addEventListener('click',()=>{if(lvlAnswered(lv)<2){toast(t('lvlNeed'));return;}S.lvlSent[i]=true;save();
      const txt='🔥 '+txEn(lv.name).toUpperCase()+' (Shakti):\n'+lv.qs.map(q=>'• '+txEn(q.l)+'\n  → '+(q.k==='opt'?pick(q):(S.texts[q.id]||'—'))).join('\n');
      award('lvl'+i,lv.pts,t('lvlSent'));stageSend(txt);renderDessert();});
    box.appendChild(d);});}

/* ===== forfeit wheel ===== */
let wheelDeg=0;
$('#spinBtn').addEventListener('click',()=>{const n=CONFIG.forfeits.length;const pk=Math.floor(Math.random()*n);const seg=360/n;
  wheelDeg+=360*5+(360-(pk*seg+seg/2))-(wheelDeg%360);$('#wheel').style.transform='rotate('+wheelDeg+'deg)';$('#spinBtn').disabled=true;$('#forfeitOut').textContent='';
  setTimeout(()=>{$('#forfeitOut').textContent=t('forfeitResult')+tx(CONFIG.forfeits[pk]);$('#spinBtn').disabled=false;S.lastForfeit=pk;save();stageSend('🎡 FORFEIT: '+txEn(CONFIG.forfeits[pk]));},4100);});

/* ===== boot ===== */
$('#extras').hidden=!CONFIG.allowExtras;renderGate();
applyLang();renderEv();renderPts();tick();
try{window.claude?.hot?.snapshot?.(()=>S);}catch(e){}
